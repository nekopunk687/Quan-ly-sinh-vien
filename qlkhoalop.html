<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Khoa - Lớp</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="sidebar">
        <h2>Quản Lý Sinh Viên</h2>
        <a href="trangchu.html">Trang chủ</a>
        <a href="qlsv.html">Quản lý Sinh viên</a>
        <a href="qlkhoalop.html" class="active">Khoa - Lớp</a>
        <a href="qldiem.html">Quản lý Điểm</a>
        <a href="#" onclick="xuLyDangXuat()">Đăng xuất</a>
    </div>

    <div class="main-content">
        <div class="header">
            <h3>Tra cứu Khoa - Lớp</h3>
            <button class="btn-logout" onclick="xuLyDangXuat()">Đăng Xuất</button>
        </div>
        <div class="content">
            <div class="box">
                <h3>Lọc Sinh Viên Theo Khoa & Lớp</h3>
                <div class="form-group">
                    <label>Chọn Khoa:</label>
                    <select id="chonKhoa" onchange="capNhatLop()">
                        <option value="">-- Tất cả Khoa --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Chọn Lớp:</label>
                    <select id="chonLop" onchange="hienThiDanhSach()">
                        <option value="">-- Tất cả Lớp --</option>
                    </select>
                </div>
            </div>

            <div class="box">
                <h3>Danh Sách Sinh Viên</h3>
                <button class="export-btn" onclick="window.print()">Xuất / In Danh Sách</button>
                <table>
                    <thead>
                        <tr>
                            <th>STT</th>
                            <th>Mã SV</th>
                            <th>Họ và Tên</th>
                            <th>Ngày Sinh</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="bangKetQua"></tbody>
                </table>
            </div>
        </div>
    </div>
    
    <script src="chung.js"></script>
    <script src="qlkhoalop.js"></script>
</body>
</html>
